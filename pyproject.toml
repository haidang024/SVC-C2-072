[project]
name = "svc-c2-072"
version = "1.0.2"
description = "Sports Competition Schedule Change Stakeholder Briefing Agent -- AgentCore Cat 2 Template"
requires-python = ">=3.11"
# The framework (agenticstar-agentcore) is NOT a public-PyPI dependency; it is
# installed from the package registry by CI and
# by the Dockerfile at image build time, both via AGENTCORE_PYPI_INDEX. Pinning
# it here means `pip install -e ".[dev]"` re-resolves this exact spec, so the
# extras combination must itself be consistent with the pinned version.
# agenticstar-agentcore[marketplace,openai]==1.0.3 brings langchain-core 1.5.4
# and langchain-openai 1.3.0 with no resolver complaint (1.0.1 pinned
# langchain-core 1.3.3, which conflicts with langchain-openai's own
# langchain-core>=1.4.3 requirement once both extras are requested together).
# PyYAML is required by the conditional PB-7 test.
dependencies = [
    "agenticstar-agentcore[marketplace,openai]==1.0.3",
    "pyyaml==6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==5.0.0",
    "pytest-asyncio==1.4.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
]

[build-system]
requires = ["setuptools==68.0.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
allow_subclassing_any = true
disallow_untyped_decorators = false
# Domain nodes predate the fleet's fully-parameterized State aliases. Retain
# the remaining strict checks while allowing those legacy annotations.
disable_error_code = [
    "no-any-return",
    "no-untyped-def",
    "type-arg",
]
